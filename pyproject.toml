[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnre"
version = "0.1.0"
description = "Local LLM pipeline for low-level reverse engineering, firmware vulnerability discovery, and agentic tool use"
readme = "README.md"
authors = [{ name = "VulnRE Research Group" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.0",
    "transformers>=4.49.0",
    "trl>=1.15.0",
    "peft>=0.21.0",
    "bitsandbytes>=0.50.0",
    "unsloth>=2026.10.0",
    "pyarrow>=14.0.0",
    "datasets>=3.0.0",
    "accelerate>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
